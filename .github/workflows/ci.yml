name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e --workers=1
      - run: pnpm build
      - run: pnpm --filter @jcb/edge exec wrangler deploy --dry-run
      - run: docker build --tag jcb-server:ci .
      - run: pnpm db:migration:check
      - run: pnpm simulation:determinism
      - run: pnpm economy:integrity
      - run: pnpm audit --audit-level high
