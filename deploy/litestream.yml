logging:
  level: info
  type: json

levels:
  - interval: 5m
  - interval: 1h
  - interval: 24h

l0-retention-check-interval: 5m

snapshot:
  interval: 24h
  retention: 720h

retention:
  enabled: true

validation:
  interval: 6h

shutdown-sync-timeout: 30s

dbs:
  - path: ${DATABASE_PATH}
    monitor-interval: 1s
    checkpoint-interval: 5m
    restore-if-db-not-exists: true
    replica:
      type: s3
      bucket: ${R2_BACKUP_BUCKET}
      path: litestream/jcb.sqlite
      endpoint: https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
      region: auto
      access-key-id: ${R2_ACCESS_KEY_ID}
      secret-access-key: ${R2_SECRET_ACCESS_KEY}
      sync-interval: 5m
      auto-recover: true
