primary_region = "nrt"
kill_signal = "SIGTERM"
kill_timeout = "45s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "3000"
  DATABASE_PATH = "/data/jcb.sqlite"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 60

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health/ready"

[mounts]
  source = "jcb_data"
  destination = "/data"
  initial_size = "1GB"
  scheduled_snapshots = true
  snapshot_retention = 30

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
